name: Content bank

on:
  schedule:
    - cron: "0 10 * * 0"   # Sundays 10:00 UTC (07:00 Paraguay)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reels
  cancel-in-progress: false

jobs:
  bank:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libcairo2
      - run: pip install -r requirements.txt
      - name: Student successes from the website
        run: python success_sync.py || echo "website sync skipped"
      - name: Analyse published reels (ideas to remix + student successes)
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BANK_MAX_NEW: ${{ vars.BANK_MAX_NEW || '8' }}
        run: python content_bank.py
      - name: Save
        if: always()
        run: |
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          git add cases.json content_bank.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Content bank $(date +%F)" && (git push || (git pull --rebase && git push)))
