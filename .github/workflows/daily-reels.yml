name: Daily reels

on:
  schedule:
    - cron: "0 16 * * *"   # midday reel  -> 12:00 New York (13:00 PY)   (weekly calendar in run_daily.py)
    - cron: "0 1 * * *"    # evening reel -> 21:00 New York (22:00 PY)
  workflow_dispatch:
    inputs:
      level:
        description: "Slot: story = midday, storytag = evening (only matters with pillar auto)"
        type: choice
        options: [story, storytag]
        default: story
      pillar:
        description: "Reel type (auto = weekly calendar)"
        type: choice
        options: [auto, success, remix, pain, faq, method, proof]
        default: auto
      dry_run:
        description: "Only generate the video (do not publish)"
        type: boolean
        default: true
      force:
        description: "Publish even if the automatic brake paused publishing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: reels
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - name: Choose slot
        id: lvl
        run: |
          case "${{ github.event.schedule }}" in
            "0 16 * * *") L=story ;;
            "0 1 * * *")  L=storytag ;;
            *)            L="${{ inputs.level }}" ;;
          esac
          echo "level=$L" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libcairo2 espeak-ng

      - name: Python packages
        run: pip install -r requirements.txt

      - name: Cache voice models
        uses: actions/cache@v4
        with:
          path: |
            models
            ~/.cache/huggingface
          key: voices-v4

      - name: Download Kokoro voice
        run: |
          mkdir -p models
          [ -f models/kokoro.onnx ] || curl -sSL -o models/kokoro.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          [ -f models/voices.bin ]  || curl -sSL -o models/voices.bin  https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin

      - name: Generate and publish
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          VOICE_ENGINE: gemini
          GEMINI_VOICE: ${{ vars.GEMINI_VOICE || 'Charon' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          # Academy decisions (Settings > Secrets and variables > Actions > Variables). Empty = defaults in brand.py
          PILLAR_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.pillar || 'auto' }}
          FORCE_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
          FB_REELS: ${{ vars.FB_REELS || 'on' }}
          STUDENT_NAMES: ${{ vars.STUDENT_NAMES || 'none' }}
          DM_KEYWORD: ${{ vars.DM_KEYWORD || 'PLAN' }}
          REEL_FORMAT: ${{ vars.REEL_FORMAT }}
          NARRATOR: ${{ vars.NARRATOR }}
          CTA_MODE: ${{ vars.CTA_MODE }}
          CTA_URL: ${{ vars.CTA_URL }}
          BOOK_URL: ${{ vars.BOOK_URL }}
          IG_HANDLE: ${{ vars.IG_HANDLE }}
          COACH_NAME: ${{ vars.COACH_NAME }}
          YT_MADE_FOR_KIDS: ${{ vars.YT_MADE_FOR_KIDS || 'false' }}
          REVIEWER: ${{ vars.REVIEWER || 'on' }}
          LEAD_WEIGHT: ${{ vars.LEAD_WEIGHT || '1.0' }}
        run: python run_daily.py ${{ steps.lvl.outputs.level }}

      - name: Save video for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ steps.lvl.outputs.level }}
          path: out/**
          retention-days: 14
          if-no-files-found: ignore

      - name: Remember used puzzles and stories
        if: always()
        run: |
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          for f in log.jsonl explainer_log.json review_log.jsonl performance.json strategy_arms.json strategy_report.md playbook.md paused.json failures.json content_bank.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet || (git commit -m "Reel ${{ steps.lvl.outputs.level }} $(date +%F)" && (git push || (git pull --rebase && git push)))
