name: Daily reels

on:
  schedule:              # TWO posts a day. Off the hour on purpose: GitHub delays :00 jobs by hours
    - cron: "37 16 * * *"   # midday slot: about 11:40 in New York (12:40 in summer)
    - cron: "37 0 * * *"    # evening slot: about 19:40 in New York (20:40 in summer)
  workflow_dispatch:
    inputs:
      kind:
        description: "Kind of animated reel (auto = calendar). Education: problem, myth, science, howto, question. Academy: method, results"
        type: choice
        options: [auto, problem, myth, science, howto, question, method, results]
        default: auto
      format:
        description: "Post type (auto = animated explainer; the others are the older formats)"
        type: choice
        options: [auto, animated, carousel, chat, kinetic, challenge, voice]
        default: auto
      topic:
        description: "Optional: make an animated reel about exactly this (e.g. 'my kid cries when he loses to younger kids')"
        type: string
        default: ""
      ending:
        description: "Ending (auto = academy reels 'comment PLAN'; educational ones 2 of 3 'send it to a parent', 1 of 3 'comment PLAN')"
        type: choice
        options: [auto, share, keyword]
        default: auto
      pillar:
        description: "Only for format voice: topic family (auto = calendar)"
        type: choice
        options: [auto, key, success, remix, pain, faq, method, proof, benefits, rating]
        default: auto
      dry_run:
        description: "Only generate the video (do not publish)"
        type: boolean
        default: true
      force:
        description: "Publish even if the automatic brake paused publishing"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write      # to delete old video artifacts (keeps the free storage quota clean)

concurrency:
  group: reels
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - name: Free artifact storage (delete videos older than 2 days)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff=$(date -u -d '2 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.created_at < \"$cutoff\") | .id" | while read id; do
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" && echo "deleted $id"; done

      - name: Choose slot
        id: lvl
        run: |
          # story = midday slot, storytag = evening slot (by the schedule that fired; by the clock when run by hand)
          if [ "${{ github.event.schedule }}" = "37 0 * * *" ]; then echo "level=storytag" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ]; then echo "level=story" >> "$GITHUB_OUTPUT"
          else h=$((10#$(date -u +%H))); if [ $h -ge 21 ] || [ $h -lt 9 ]; then echo "level=storytag" >> "$GITHUB_OUTPUT"; else echo "level=story" >> "$GITHUB_OUTPUT"; fi; fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libcairo2 espeak-ng

      - name: Python packages
        run: pip install -r requirements.txt

      - name: Cache voice models
        uses: actions/cache@v4
        with:
          path: |
            models
            ~/.cache/huggingface
          key: voices-v4

      - name: Cache puzzle database (challenge reels)
        uses: actions/cache@v4
        with:
          path: data
          key: puzzles-v1

      - name: Download Kokoro voice
        run: |
          mkdir -p models
          [ -f models/kokoro.onnx ] || curl -sSL -o models/kokoro.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          [ -f models/voices.bin ]  || curl -sSL -o models/voices.bin  https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin

      - name: Generate and publish
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          # TikTok / YouTube through Zernio. If the Zernio account has more than one TikTok or YouTube account,
          # say which one belongs to the academy (name or id): Settings > Variables.
          ZERNIO_TT_ACCOUNT: ${{ vars.ZERNIO_TT_ACCOUNT }}
          ZERNIO_YT_ACCOUNT: ${{ vars.ZERNIO_YT_ACCOUNT }}
          ZERNIO_PROFILE: ${{ vars.ZERNIO_PROFILE }}
          TIKTOK: ${{ vars.TIKTOK || 'on' }}
          YOUTUBE: ${{ vars.YOUTUBE || 'on' }}
          TIKTOK_AI_LABEL: ${{ vars.TIKTOK_AI_LABEL || 'on' }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          VOICE_ENGINE: gemini
          GEMINI_VOICE: ${{ vars.GEMINI_VOICE || 'Charon' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          # Academy decisions (Settings > Secrets and variables > Actions > Variables). Empty = defaults in brand.py
          PILLAR_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.pillar || 'auto' }}
          FORCE_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
          FB_REELS: ${{ vars.FB_REELS || 'on' }}
          FORMAT_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.format || 'auto' }}
          KIND_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.kind || 'auto' }}
          STUDIO: ${{ vars.STUDIO || 'off' }}
          TOPIC_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.topic || '' }}
          ANIM_CTA: ${{ github.event_name == 'workflow_dispatch' && inputs.ending || vars.ANIM_CTA || 'auto' }}
          VOICE_TEMPO: ${{ vars.VOICE_TEMPO || '1.07' }}
          FIRST_COMMENT: ${{ vars.FIRST_COMMENT || 'on' }}
          ANIM_CRITIC: ${{ vars.ANIM_CRITIC || 'on' }}
          STUDENT_NAMES: ${{ vars.STUDENT_NAMES || 'none' }}
          DM_KEYWORD: ${{ vars.DM_KEYWORD || 'PLAN' }}
          REEL_FORMAT: ${{ vars.REEL_FORMAT }}
          NARRATOR: ${{ vars.NARRATOR }}
          CTA_MODE: ${{ vars.CTA_MODE }}
          CTA_URL: ${{ vars.CTA_URL }}
          BOOK_URL: ${{ vars.BOOK_URL }}
          IG_HANDLE: ${{ vars.IG_HANDLE }}
          COACH_NAME: ${{ vars.COACH_NAME }}
          YT_MADE_FOR_KIDS: ${{ vars.YT_MADE_FOR_KIDS || 'false' }}
          REVIEWER: ${{ vars.REVIEWER || 'on' }}
          LEAD_WEIGHT: ${{ vars.LEAD_WEIGHT || '1.0' }}
        run: python run_daily.py ${{ steps.lvl.outputs.level }}

      - name: Save video for review
        if: always()
        continue-on-error: true          # a full artifact quota must never mark the run as failed
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ steps.lvl.outputs.level }}-${{ github.run_number }}
          path: |
            out/*.mp4
            out/*.txt
            out/*_carousel/*.jpg
            !out/*_review.mp4
          retention-days: 3
          compression-level: 0
          if-no-files-found: ignore

      - name: Remember used stories, footage and results
        if: always()
        run: |
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          for f in log.jsonl formats_log.json used.json explainer_log.json review_log.jsonl performance.json strategy_arms.json stock_used.json strategy_report.md playbook.md paused.json failures.json content_bank.json; do [ -f "$f" ] && git add "$f"; done
          [ -d agents ] && git add agents
          git diff --cached --quiet || (git commit -m "Reel ${{ steps.lvl.outputs.level }} $(date +%F)" && (git push || (git pull --rebase && git push)))
